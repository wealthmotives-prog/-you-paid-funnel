name: WorkVerify security smoke unit checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/workverify_http_security_smoke.py'
      - 'tests/test_workverify_http_smoke_offline.py'
      - 'tests/test_prelaunch_ad_readiness.py'
      - 'tests/test_workscore_formula_lab.py'
      - 'tests/test_workscore_audit_lab.py'
      - 'research/workscore_audit_lab.py'
      - 'tests/test_workscore_browser_parity.py'
      - 'workscore-lab.html'
      - 'research/workscore_lab.py'
      - 'index.html'
      - 'app.html'
      - '.github/workflows/workverify-http-offline-tests.yml'
  pull_request:
    paths:
      - 'tests/workverify_http_security_smoke.py'
      - 'tests/test_workverify_http_smoke_offline.py'
      - '.github/workflows/workverify-http-offline-tests.yml'
permissions:
  contents: read
jobs:
  offline-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify deterministic offline security assertions
        run: |
          python -m unittest discover -s tests -p 'test_workverify_http_smoke_offline.py' -v
          python -m unittest discover -s tests -p 'test_prelaunch_ad_readiness.py' -v
          python -m unittest discover -s tests -p 'test_workscore_formula_lab.py' -v
          python -m unittest discover -s tests -p 'test_workscore_browser_parity.py' -v
          python -m unittest discover -s tests -p 'test_workscore_audit_lab.py' -v
